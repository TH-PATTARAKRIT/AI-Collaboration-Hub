name: DEVTOOL Auth Readiness Check

on:
  push:
    branches:
      - control/devtool-validation-2026-09-11-001
    paths:
      - '.github/workflows/devtool-secret-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      JUNIE_API_KEY: ${{ secrets.JUNIE_API_KEY }}
    steps:
      - name: Check configured secret presence without printing values
        shell: bash
        run: |
          set -euo pipefail
          check_key() {
            local name="$1"
            if [ -n "${!name:-}" ]; then
              printf '%s=PRESENT\n' "$name"
            else
              printf '%s=ABSENT\n' "$name"
            fi
          }
          check_key ANTHROPIC_API_KEY
          check_key OPENAI_API_KEY
          check_key CURSOR_API_KEY
          check_key JUNIE_API_KEY
          echo 'NOTE=Presence only. No secret value is printed or persisted.'
